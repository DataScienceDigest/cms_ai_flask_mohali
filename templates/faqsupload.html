<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>techcadd FAQ Generator</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f3f4f6;padding:30px;color:#1f2937}.container{max-width:1100px;margin:auto}.section{background:white;padding:25px;margin-bottom:20px;border:1px solid #ddd;border-radius:10px}label{display:block;font-weight:bold;margin-top:12px}input,select,textarea{width:100%;padding:12px;border:1px solid #ccc;border-radius:5px;margin:8px 0;font:inherit}textarea{resize:vertical}button{padding:12px 20px;background:#2563eb;color:white;border:0;border-radius:5px;cursor:pointer;margin:8px 6px 8px 0}button:disabled{opacity:.5;cursor:not-allowed}.green{background:#16a34a}.faq{border:1px solid #ddd;border-radius:8px;padding:16px;margin:12px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#111827;color:#e5e7eb;padding:16px;border-radius:8px}progress{width:100%}.muted{color:#64748b}.good{color:#15803d}.bad{color:#b91c1c}
</style></head>
<body><main class="container"><h1>techcadd FAQ Generator</h1><div class="section"><h2>Step 1: Generate FAQs with OpenAI</h2><form id="generate-form"><label for="topic">Topic name</label><input id="topic" required maxlength="500" placeholder="e.g. 6 Months Agentic AI Training in Mohali"><label for="category">FAQ category</label><select id="category" required><option value="">Select category</option>{% for category in categories %}<option value="{{ category }}">{{ category }}</option>{% endfor %}</select><label for="count">Number of FAQs</label><select id="count">{% for n in range(1, max_count + 1) %}<option value="{{ n }}" {% if n == 15 %}selected{% endif %}>{{ n }}</option>{% endfor %}</select><button id="generate" type="submit">Generate FAQs</button></form><p id="generation-status" role="status"></p></div>
<div class="section" id="review" hidden><h2>Step 2: Review and edit FAQs</h2><p class="muted">Uncheck any FAQ you do not want to publish. Published items cannot be submitted again from this list.</p><div id="items"></div><button id="copy" type="button">Copy JSON</button><button id="download" type="button">Download JSON</button><h2>Step 3: Publish FAQs</h2><button id="publish" type="button" class="green">Post Selected FAQs to CMS</button><progress id="progress" value="0" max="1"></progress><p id="publish-status" role="status"></p><pre id="response" hidden></pre></div></main>
<script>
const $=id=>document.getElementById(id);let rows=[],busy=false;
function payload(row){return {question:row.q.value.trim(),answer:row.a.value.trim(),categoryName:row.category,order:row.order,featured:false,status:'published'};}
function lock(flag){busy=flag;for(const id of ['generate','topic','category','count','publish','copy','download'])$(id).disabled=flag;for(const row of rows){row.q.disabled=flag||row.done;row.a.disabled=flag||row.done;row.check.disabled=flag||row.done||row.uncertain;}}
async function post(url,data){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const result=await r.json();return {ok:r.ok&&result.success,result};}
function render(items){rows=[];$('items').replaceChildren();items.forEach((item,i)=>{const box=document.createElement('div');box.className='faq';const heading=document.createElement('h3');heading.textContent=`FAQ ${i+1}`;const check=document.createElement('input');check.type='checkbox';check.checked=true;check.style.width='auto';check.setAttribute('aria-label',`Select FAQ ${i+1}`);heading.prepend(check,' ');const q=document.createElement('textarea');q.rows=2;q.value=item.question;q.setAttribute('aria-label',`Question ${i+1}`);const a=document.createElement('textarea');a.rows=4;a.value=item.answer;a.setAttribute('aria-label',`Answer ${i+1}`);const status=document.createElement('p');status.className='muted';status.textContent=item.categoryName;box.append(heading,q,a,status);$('items').append(box);rows.push({q,a,check,status,category:item.categoryName,order:item.order,done:false,uncertain:false});});$('review').hidden=false;$('response').hidden=true;$('response').textContent='';$('publish-status').textContent='';$('progress').value=0;}
$('generate-form').addEventListener('submit',async e=>{e.preventDefault();if(busy)return;if(rows.length&&!confirm('Replace the current FAQ list? Previously published FAQs will remain in the CMS.'))return;lock(true);$('generation-status').textContent='Generating and validating FAQs using OpenAI...';try{const {ok,result}=await post('/generate-faqs',{topic:$('topic').value,categoryName:$('category').value,count:Number($('count').value)});if(!ok)throw Error(result.error||'Generation failed.');render(result.items);$('generation-status').textContent=`${result.items.length} FAQs generated successfully.`;}catch(e){$('generation-status').textContent=e.message;}finally{lock(false);}});
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify(rows.map(payload),null,2));$('publish-status').textContent='JSON copied.';}catch(e){$('publish-status').textContent='Clipboard unavailable. Use Download JSON.';}};
$('download').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(rows.map(payload),null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='faqs-payload.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
$('publish').onclick=async()=>{if(busy)return;const selected=rows.filter(r=>r.check.checked&&!r.done&&!r.uncertain);if(!selected.length){$('publish-status').textContent='Select at least one unpublished FAQ.';return;}const keys=new Set();for(const row of selected){const p=payload(row),key=p.question.toLowerCase().replace(/\?$/,'').replace(/\s+/g,' ');if(!p.question||!p.answer||keys.has(key)){$('publish-status').textContent='Remove duplicate or empty questions and answers before publishing.';return;}keys.add(key);}if(!confirm(`Publish ${selected.length} FAQs to Mohali CMS?`))return;lock(true);let success=0,failed=0,uncertain=0,processed=0;const logs=[];$('progress').max=selected.length;$('progress').value=0;$('response').hidden=false;try{for(const row of selected){row.status.textContent='Posting...';try{const {ok,result}=await post('/publish-faq',{payload:payload(row)});logs.push({question:row.q.value,...result});if(ok){row.done=true;row.check.checked=false;row.status.textContent='Published successfully';row.status.className='good';success++;}else if(result.uncertain||result.status>=500||result.status>=200&&result.status<300){row.uncertain=true;row.check.checked=false;row.status.textContent='Unconfirmed — check CMS before retrying';row.status.className='bad';uncertain++;}else{row.status.textContent='Failed: '+(result.error||JSON.stringify(result.response));row.status.className='bad';failed++;}}catch(e){row.uncertain=true;row.check.checked=false;row.status.textContent='Unconfirmed — check CMS before retrying';row.status.className='bad';logs.push({question:row.q.value,error:e.message});uncertain++;}processed++;$('progress').value=processed;$('publish-status').textContent=`Processed ${processed}/${selected.length} | Published ${success} | Failed ${failed} | Unconfirmed ${uncertain}`;$('response').textContent=JSON.stringify(logs,null,2);}}finally{lock(false);}};
</script></body></html>
